<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crimson Reaper Webcam Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>

/* ============================================================
   CRIMSON REAPER WEBCAM OVERLAY
   1920x1080 Browser Source — Transparent Background
   In OBS: Add as Browser Source, 1920x1080, transparent BG
   Your webcam/nested scene sits BEHIND this overlay
   ============================================================ */

:root {
  --crimson:        #8B0000;
  --crimson-bright: #CC0000;
  --crimson-glow:   #FF1111;
  --crimson-deep:   #4A0000;
  --blood-dark:     #1a0000;
  --gold:           #C9A84C;
  --gold-bright:    #FFD700;
  --ash:            #AAAAAA;
  --white:          #F0E8E8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1920px;
  height: 1080px;
  background: transparent;
  overflow: hidden;
}

/* ============================================================
   MAIN FRAME WRAPPER
   Position this over your webcam in OBS
   Default: bottom-left corner placement
   ============================================================ */

.cam-wrapper {
  position: absolute;
  bottom: 40px;
  left: 40px;
  width: 480px;
  height: 360px;
}

/* ============================================================
   OUTER FRAME — angled corners matching alert style
   ============================================================ */

.cam-frame {
  position: absolute;
  inset: 0;
  clip-path: polygon(
    24px 0%,
    calc(100% - 24px) 0%,
    100% 24px,
    100% calc(100% - 24px),
    calc(100% - 24px) 100%,
    24px 100%,
    0% calc(100% - 24px),
    0% 24px
  );
  background: transparent;
  border: 2px solid var(--crimson-bright);
  z-index: 10;
  pointer-events: none;
}

/* Glowing border */
.cam-frame::before {
  content: '';
  position: absolute;
  inset: -2px;
  clip-path: polygon(
    24px 0%,
    calc(100% - 24px) 0%,
    100% 24px,
    100% calc(100% - 24px),
    calc(100% - 24px) 100%,
    24px 100%,
    0% calc(100% - 24px),
    0% 24px
  );
  background: linear-gradient(135deg, var(--crimson-glow), var(--crimson-deep), var(--crimson-glow));
  z-index: -1;
  filter: blur(6px);
  opacity: 0.7;
  animation: framePulse 3s ease-in-out infinite;
}

/* Top accent line */
.cam-frame::after {
  content: '';
  position: absolute;
  top: 0; left: 24px; right: 24px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--crimson-glow), var(--gold), var(--crimson-glow), transparent);
  animation: scanline 3s linear infinite;
}

@keyframes framePulse {
  0%, 100% { opacity: 0.5; filter: blur(5px); }
  50%       { opacity: 0.9; filter: blur(8px); }
}

@keyframes scanline {
  0%   { opacity: 0.6; }
  50%  { opacity: 1.0; }
  100% { opacity: 0.6; }
}

/* ============================================================
   CORNER DECORATIONS
   ============================================================ */

.corner-deco {
  position: absolute;
  width: 40px;
  height: 40px;
  border-color: var(--gold);
  border-style: solid;
  opacity: 0.9;
  z-index: 20;
  pointer-events: none;
}
.corner-deco.tl { top: -1px;  left: -1px;  border-width: 3px 0 0 3px; }
.corner-deco.tr { top: -1px;  right: -1px; border-width: 3px 3px 0 0; }
.corner-deco.bl { bottom: -1px; left: -1px;  border-width: 0 0 3px 3px; }
.corner-deco.br { bottom: -1px; right: -1px; border-width: 0 3px 3px 0; }

/* Corner dots */
.corner-deco::after {
  content: '';
  position: absolute;
  width: 6px;
  height: 6px;
  background: var(--gold-bright);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--gold);
}
.corner-deco.tl::after { top: -3px;  left: -3px; }
.corner-deco.tr::after { top: -3px;  right: -3px; }
.corner-deco.bl::after { bottom: -3px; left: -3px; }
.corner-deco.br::after { bottom: -3px; right: -3px; }

/* ============================================================
   SIDE TICK MARKS — tactical reticle feel
   ============================================================ */

.tick {
  position: absolute;
  background: var(--crimson-bright);
  opacity: 0.6;
  z-index: 20;
  pointer-events: none;
}
/* Top ticks */
.tick.t1 { top: -1px; left: 25%;  width: 20px; height: 2px; }
.tick.t2 { top: -1px; left: 50%;  width: 30px; height: 2px; transform: translateX(-50%); background: var(--gold); opacity: 0.8; }
.tick.t3 { top: -1px; right: 25%; width: 20px; height: 2px; }
/* Bottom ticks */
.tick.b1 { bottom: -1px; left: 25%;  width: 20px; height: 2px; }
.tick.b2 { bottom: -1px; left: 50%;  width: 30px; height: 2px; transform: translateX(-50%); background: var(--gold); opacity: 0.8; }
.tick.b3 { bottom: -1px; right: 25%; width: 20px; height: 2px; }
/* Left ticks */
.tick.l1 { left: -1px; top: 25%;    height: 20px; width: 2px; }
.tick.l2 { left: -1px; top: 50%;    height: 30px; width: 2px; transform: translateY(-50%); background: var(--gold); opacity: 0.8; }
.tick.l3 { left: -1px; bottom: 25%; height: 20px; width: 2px; }
/* Right ticks */
.tick.r1 { right: -1px; top: 25%;    height: 20px; width: 2px; }
.tick.r2 { right: -1px; top: 50%;    height: 30px; width: 2px; transform: translateY(-50%); background: var(--gold); opacity: 0.8; }
.tick.r3 { right: -1px; bottom: 25%; height: 20px; width: 2px; }

/* ============================================================
   SCANNING LINE EFFECT — sweeps across cam feed
   ============================================================ */

.scan-sweep {
  position: absolute;
  inset: 0;
  z-index: 15;
  pointer-events: none;
  overflow: hidden;
  clip-path: polygon(
    24px 0%, calc(100% - 24px) 0%,
    100% 24px, 100% calc(100% - 24px),
    calc(100% - 24px) 100%, 24px 100%,
    0% calc(100% - 24px), 0% 24px
  );
}

.scan-sweep::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,17,17,0.3), rgba(255,17,17,0.6), rgba(255,17,17,0.3), transparent);
  animation: sweep 4s linear infinite;
  box-shadow: 0 0 10px rgba(255,17,17,0.4);
}

@keyframes sweep {
  0%   { top: -2px; opacity: 0; }
  5%   { opacity: 1; }
  95%  { opacity: 1; }
  100% { top: 100%; opacity: 0; }
}

/* ============================================================
   VIGNETTE — darkens cam edges for drama
   ============================================================ */

.vignette {
  position: absolute;
  inset: 0;
  z-index: 12;
  pointer-events: none;
  background: radial-gradient(
    ellipse at center,
    transparent 40%,
    rgba(74,0,0,0.3) 70%,
    rgba(26,0,0,0.6) 100%
  );
  clip-path: polygon(
    24px 0%, calc(100% - 24px) 0%,
    100% 24px, 100% calc(100% - 24px),
    calc(100% - 24px) 100%, 24px 100%,
    0% calc(100% - 24px), 0% 24px
  );
}


/* ============================================================
   NAME PLATE
   ============================================================ */

.nameplate {
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 56px;
  z-index: 25;
  pointer-events: none;
}

/* Nameplate background */
.nameplate-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg,
    rgba(10,0,0,0.97) 0%,
    rgba(40,0,0,0.95) 30%,
    rgba(40,0,0,0.95) 70%,
    rgba(10,0,0,0.97) 100%
  );
  clip-path: polygon(12px 0%, calc(100% - 12px) 0%, 100% 100%, 0% 100%);
  border-top: 1px solid var(--crimson-bright);
}

.nameplate-bg::before {
  content: '';
  position: absolute;
  top: 0; left: 12px; right: 12px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--crimson-glow), var(--gold), var(--crimson-glow), transparent);
}

/* Name content */
.nameplate-inner {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  z-index: 2;
}

.streamer-name {
  font-family: 'Bebas Neue', cursive;
  font-size: 28px;
  letter-spacing: 6px;
  color: var(--white);
  text-shadow:
    0 0 20px var(--crimson-glow),
    0 0 40px var(--crimson),
    2px 2px 0 var(--crimson-deep);
  line-height: 1;
}

.streamer-title {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--gold);
  text-shadow: 0 0 8px var(--gold), 1px 1px 0 rgba(0,0,0,0.8);
  opacity: 0.9;
}

/* Nameplate side diamonds */
.nameplate-diamond {
  position: absolute;
  top: 50%;
  transform: translateY(-50%) rotate(45deg);
  width: 8px;
  height: 8px;
  background: var(--gold-bright);
  box-shadow: 0 0 8px var(--gold);
}
.nameplate-diamond.left  { left: 16px; }
.nameplate-diamond.right { right: 16px; }

/* ============================================================
   STATUS INDICATORS — top right corner of cam
   ============================================================ */

.status-bar {
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  z-index: 25;
  pointer-events: none;
}

.status-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'Orbitron', monospace;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--ash);
  text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--crimson-glow);
  box-shadow: 0 0 6px var(--crimson-glow);
  animation: dotBlink 1s step-end infinite;
}

.status-dot.gold {
  background: var(--gold-bright);
  box-shadow: 0 0 6px var(--gold);
  animation: dotBlink 2s step-end infinite;
}

@keyframes dotBlink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.2; }
}

/* ============================================================
   TARGETING RETICLE — center of cam (subtle)
   ============================================================ */

.reticle {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 40px;
  height: 40px;
  z-index: 14;
  pointer-events: none;
  opacity: 0.15;
}

.reticle::before, .reticle::after {
  content: '';
  position: absolute;
  background: var(--crimson-glow);
}

.reticle::before {
  top: 50%; left: 0; right: 0;
  height: 1px;
  transform: translateY(-50%);
}

.reticle::after {
  left: 50%; top: 0; bottom: 0;
  width: 1px;
  transform: translateX(-50%);
}

.reticle-circle {
  position: absolute;
  inset: 6px;
  border: 1px solid var(--crimson-glow);
  border-radius: 50%;
}

/* ============================================================
   BLOOD DRIP PARTICLES — top of frame
   ============================================================ */

.drip-container {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 30px;
  z-index: 18;
  pointer-events: none;
  overflow: hidden;
}

.drip {
  position: absolute;
  top: 0;
  width: 2px;
  border-radius: 0 0 2px 2px;
  background: linear-gradient(180deg, var(--crimson-glow), var(--crimson));
  opacity: 0;
  animation: dripLoop 6s ease-in infinite;
}

.drip:nth-child(1) { left: 10%;  height: 14px; animation-delay: 0s;   animation-duration: 5s; }
.drip:nth-child(2) { left: 22%;  height: 10px; animation-delay: 1.5s; animation-duration: 6s; }
.drip:nth-child(3) { left: 38%;  height: 18px; animation-delay: 0.8s; animation-duration: 4.5s; }
.drip:nth-child(4) { left: 55%;  height: 12px; animation-delay: 2.2s; animation-duration: 5.5s; }
.drip:nth-child(5) { left: 70%;  height: 16px; animation-delay: 0.3s; animation-duration: 5s; }
.drip:nth-child(6) { left: 85%;  height: 10px; animation-delay: 1.8s; animation-duration: 6s; }

@keyframes dripLoop {
  0%   { opacity: 0; transform: translateY(-100%); }
  10%  { opacity: 0.8; }
  80%  { opacity: 0.4; }
  100% { opacity: 0; transform: translateY(200%); }
}

/* ============================================================
   DECORATIVE SIDE PANEL — left edge accent
   ============================================================ */

.side-accent {
  position: absolute;
  left: -20px;
  top: 20%;
  bottom: 20%;
  width: 4px;
  z-index: 5;
  pointer-events: none;
}

.side-accent::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent, var(--crimson-glow), var(--gold), var(--crimson-glow), transparent);
  animation: accentPulse 3s ease-in-out infinite;
}

.side-accent::after {
  content: '';
  position: absolute;
  inset: -2px;
  background: linear-gradient(180deg, transparent, var(--crimson-glow), transparent);
  filter: blur(4px);
  animation: accentPulse 3s ease-in-out infinite;
}

@keyframes accentPulse {
  0%, 100% { opacity: 0.4; }
  50%       { opacity: 1.0; }
}

</style>
</head>
<body>

<!-- ============================================================
     WEBCAM OVERLAY
     Place this browser source OVER your webcam in OBS
     Set browser source to 1920x1080, transparent background
     ============================================================ -->

<div class="cam-wrapper">

  <!-- Side accent -->
  <div class="side-accent"></div>

  <!-- Main frame border -->
  <div class="cam-frame"></div>

  <!-- Corner decorations -->
  <div class="corner-deco tl"></div>
  <div class="corner-deco tr"></div>
  <div class="corner-deco bl"></div>
  <div class="corner-deco br"></div>

  <!-- Tick marks -->
  <div class="tick t1"></div>
  <div class="tick t2"></div>
  <div class="tick t3"></div>
  <div class="tick b1"></div>
  <div class="tick b2"></div>
  <div class="tick b3"></div>
  <div class="tick l1"></div>
  <div class="tick l2"></div>
  <div class="tick l3"></div>
  <div class="tick r1"></div>
  <div class="tick r2"></div>
  <div class="tick r3"></div>

  <!-- Scanning sweep line -->
  <div class="scan-sweep"></div>

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- Blood drips -->
  <div class="drip-container">
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>
  </div>

  <!-- Subtle targeting reticle -->
  <div class="reticle">
    <div class="reticle-circle"></div>
  </div>

  <!-- Status indicators -->
  <div class="status-bar">
    <div class="status-item">
      <span>LIVE</span>
      <div class="status-dot"></div>
    </div>
    <div class="status-item">
      <span>CAM</span>
      <div class="status-dot gold"></div>
    </div>
  </div>

  <!-- Name plate -->
  <div class="nameplate">
    <div class="nameplate-bg"></div>
    <div class="nameplate-diamond left"></div>
    <div class="nameplate-diamond right"></div>
    <div class="nameplate-inner">
      <div class="streamer-name">MIRRAKILLZ</div>
      <div class="streamer-title">THE CRIMSON REAPER</div>
    </div>
  </div>

</div>

</body>
</html>
