<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crimson Reaper Stream Boss</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>

/* ============================================================
   CRIMSON REAPER STREAM BOSS — DRAMATIC EDITION
   1920x1080 — Center screen reveal
   ============================================================ */

:root {
  --crimson:        #8B0000;
  --crimson-bright: #CC0000;
  --crimson-glow:   #FF1111;
  --crimson-deep:   #4A0000;
  --gold:           #C9A84C;
  --gold-bright:    #FFD700;
  --blue:           #4488FF;
  --blue-bright:    #88BBFF;
  --ash:            #AAAAAA;
  --white:          #F0E8E8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1920px;
  height: 1080px;
  background: transparent;
  overflow: hidden;
  font-family: 'Rajdhani', sans-serif;
}

/* ============================================================
   SCREEN FLASH — full screen effect layer
   ============================================================ */

.screen-flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1000;
  opacity: 0;
}

.screen-flash.crimson { background: radial-gradient(ellipse at center, rgba(255,17,17,0.4), rgba(139,0,0,0.6)); }
.screen-flash.gold    { background: radial-gradient(ellipse at center, rgba(255,215,0,0.3), rgba(201,168,76,0.5)); }
.screen-flash.death   { background: rgba(139,0,0,0.85); }

.screen-flash.flash-in {
  animation: flashIn 0.1s ease forwards;
}
.screen-flash.flash-out {
  animation: flashOut 0.5s ease forwards;
}

@keyframes flashIn {
  0%   { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes flashOut {
  0%   { opacity: 1; }
  100% { opacity: 0; }
}

/* ============================================================
   SCREEN EDGE VIGNETTE — pulses on hit
   ============================================================ */

.screen-vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  opacity: 0;
  background: radial-gradient(ellipse at center,
    transparent 40%,
    rgba(139,0,0,0.0) 60%,
    rgba(255,17,17,0.5) 100%
  );
}

.screen-vignette.pulse {
  animation: vignettePulse 0.4s ease forwards;
}

@keyframes vignettePulse {
  0%   { opacity: 0; }
  20%  { opacity: 1; }
  100% { opacity: 0; }
}

/* ============================================================
   BOSS WRAPPER — centered
   ============================================================ */

.boss-wrapper {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) translateY(-300px) scale(0.8);
  width: 960px;
  opacity: 0;
  pointer-events: none;
}

.boss-wrapper.reveal {
  animation: bossReveal 0.7s cubic-bezier(0.22,1,0.36,1) forwards;
}

.boss-wrapper.active {
  opacity: 1;
  transform: translate(-50%, -50%) translateY(0) scale(1);
}

.boss-wrapper.death-explode {
  animation: bossExplode 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
}

.boss-wrapper.hidden {
  opacity: 0;
  pointer-events: none;
}

@keyframes bossReveal {
  0%   { opacity: 0; transform: translate(-50%, calc(-50% - 200px)) scale(0.85); }
  40%  { opacity: 1; transform: translate(-50%, calc(-50% + 20px))  scale(1.04); }
  60%  { transform: translate(-50%, calc(-50% - 8px))  scale(0.98); }
  80%  { transform: translate(-50%, calc(-50% + 4px))  scale(1.01); }
  100% { opacity: 1; transform: translate(-50%, -50%)  scale(1); }
}

@keyframes bossExplode {
  0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.08); filter: brightness(3); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); filter: brightness(0); }
}

/* ============================================================
   SHOCKWAVE RING
   ============================================================ */

.shockwave {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 3px solid var(--crimson-glow);
  opacity: 0;
  pointer-events: none;
  z-index: 5;
}

.shockwave.fire {
  animation: shockwaveFire 0.8s ease-out forwards;
}

@keyframes shockwaveFire {
  0%   { width: 100px;  height: 100px;  opacity: 0.8; border-color: var(--crimson-glow); }
  50%  { opacity: 0.4; border-color: var(--gold); }
  100% { width: 1400px; height: 500px;  opacity: 0; border-color: transparent; }
}

/* ============================================================
   TITLE PLATE
   ============================================================ */

.boss-title-plate {
  position: relative;
  width: 500px;
  height: 32px;
  margin: 0 auto -1px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(40,0,0,0.99), rgba(80,0,0,0.97), rgba(40,0,0,0.99));
  border: 1px solid var(--crimson-bright);
  clip-path: polygon(20px 0%, calc(100% - 20px) 0%, 100% 50%, calc(100% - 20px) 100%, 20px 100%, 0% 50%);
  z-index: 2;
}

.boss-title-plate::before {
  content: '';
  position: absolute;
  inset: -2px;
  background: linear-gradient(135deg, var(--crimson-glow), var(--crimson-deep), var(--gold), var(--crimson-deep), var(--crimson-glow));
  clip-path: polygon(20px 0%, calc(100% - 20px) 0%, 100% 50%, calc(100% - 20px) 100%, 20px 100%, 0% 50%);
  z-index: -1;
  filter: blur(6px);
  opacity: 0.8;
  animation: titleAura 2s ease-in-out infinite;
}

@keyframes titleAura {
  0%, 100% { opacity: 0.6; filter: blur(5px); }
  50%       { opacity: 1.0; filter: blur(9px); }
}

.boss-title-text {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 5px;
  color: var(--crimson-glow);
  text-shadow: 0 0 8px var(--crimson-glow);
  animation: titleFlicker 3s ease-in-out infinite;
}

@keyframes titleFlicker {
  0%, 90%, 100% { opacity: 1; }
  92%           { opacity: 0.3; }
  94%           { opacity: 1; }
  96%           { opacity: 0.2; }
  98%           { opacity: 1; }
}

/* ============================================================
   MAIN BOSS CARD
   ============================================================ */

.boss-card {
  position: relative;
  background: linear-gradient(135deg,
    rgba(6,0,0,0.98) 0%,
    rgba(18,0,0,0.97) 40%,
    rgba(6,0,0,0.98) 100%
  );
  border: 2px solid var(--crimson-bright);
  clip-path: polygon(
    20px 0%, calc(100% - 20px) 0%,
    100% 20px, 100% calc(100% - 20px),
    calc(100% - 20px) 100%, 20px 100%,
    0% calc(100% - 20px), 0% 20px
  );
  padding: 20px 28px;
  overflow: hidden;
}

/* Breathing glow — changes color per phase */
.boss-card::before {
  content: '';
  position: absolute;
  inset: -3px;
  background: var(--card-glow, linear-gradient(135deg, var(--crimson-glow), var(--crimson-deep), var(--crimson-glow)));
  clip-path: polygon(
    20px 0%, calc(100% - 20px) 0%,
    100% 20px, 100% calc(100% - 20px),
    calc(100% - 20px) 100%, 20px 100%,
    0% calc(100% - 20px), 0% 20px
  );
  z-index: -1;
  filter: blur(8px);
  opacity: 0.6;
  animation: cardBreath 2.5s ease-in-out infinite;
}

@keyframes cardBreath {
  0%, 100% { opacity: 0.4; filter: blur(7px); }
  50%       { opacity: 0.9; filter: blur(12px); }
}

/* Top accent line */
.boss-card::after {
  content: '';
  position: absolute;
  top: 0; left: 20px; right: 20px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--crimson-glow), var(--gold-bright), var(--crimson-glow), transparent);
  animation: accentScan 3s linear infinite;
}

@keyframes accentScan {
  0%   { opacity: 0.5; }
  50%  { opacity: 1.0; }
  100% { opacity: 0.5; }
}

/* Blood drip effect on card edges */
.boss-drips {
  position: absolute;
  top: 0; left: 20px; right: 20px;
  height: 20px;
  pointer-events: none;
  z-index: 10;
}

.boss-drip {
  position: absolute;
  top: 2px;
  width: 2px;
  border-radius: 0 0 2px 2px;
  background: linear-gradient(180deg, var(--crimson-glow), var(--crimson));
  opacity: 0;
  animation: bossdrip 5s ease-in infinite;
}

.boss-drip:nth-child(1) { left: 8%;   height: 12px; animation-delay: 0s;   animation-duration: 4s; }
.boss-drip:nth-child(2) { left: 20%;  height: 8px;  animation-delay: 1.2s; animation-duration: 5s; }
.boss-drip:nth-child(3) { left: 35%;  height: 15px; animation-delay: 0.6s; animation-duration: 4.5s; }
.boss-drip:nth-child(4) { left: 50%;  height: 10px; animation-delay: 2s;   animation-duration: 5s; }
.boss-drip:nth-child(5) { left: 65%;  height: 14px; animation-delay: 0.3s; animation-duration: 4s; }
.boss-drip:nth-child(6) { left: 80%;  height: 9px;  animation-delay: 1.6s; animation-duration: 5.5s; }
.boss-drip:nth-child(7) { left: 92%;  height: 12px; animation-delay: 0.8s; animation-duration: 4.2s; }

@keyframes bossdrip {
  0%   { opacity: 0; transform: scaleY(0); }
  10%  { opacity: 0.8; transform: scaleY(1); }
  80%  { opacity: 0.4; transform: translateY(60px) scaleY(1); }
  100% { opacity: 0; transform: translateY(80px); }
}

/* Corner decorations */
.boss-corner {
  position: absolute;
  width: 20px;
  height: 20px;
  border-color: var(--gold);
  border-style: solid;
  opacity: 0.8;
}
.boss-corner.tl { top: 6px;  left: 24px;  border-width: 2px 0 0 2px; }
.boss-corner.tr { top: 6px;  right: 24px; border-width: 2px 2px 0 0; }
.boss-corner.bl { bottom: 6px; left: 24px;  border-width: 0 0 2px 2px; }
.boss-corner.br { bottom: 6px; right: 24px; border-width: 0 2px 2px 0; }

/* Scan line across card */
.boss-scanline {
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,17,17,0.2), rgba(255,17,17,0.4), rgba(255,17,17,0.2), transparent);
  pointer-events: none;
  animation: bossscan 4s linear infinite;
}

@keyframes bossscan {
  0%   { top: 0; opacity: 0; }
  5%   { opacity: 1; }
  95%  { opacity: 1; }
  100% { top: 100%; opacity: 0; }
}

/* ============================================================
   BOSS INFO ROW
   ============================================================ */

.boss-info-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 16px;
  position: relative;
  z-index: 2;
}

/* Boss avatar */
.boss-avatar {
  width: 80px;
  height: 80px;
  flex-shrink: 0;
  position: relative;
}

.boss-avatar-hex {
  width: 100%;
  height: 100%;
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  background: linear-gradient(135deg, var(--crimson-deep), var(--crimson));
  border: 2px solid var(--crimson-bright);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  color: var(--gold-bright);
  animation: avatarBreath 2s ease-in-out infinite;
}

@keyframes avatarBreath {
  0%, 100% { filter: drop-shadow(0 0 6px var(--crimson-glow)); transform: scale(1); }
  50%       { filter: drop-shadow(0 0 18px var(--crimson-glow)) drop-shadow(0 0 30px var(--crimson)); transform: scale(1.06); }
}

/* Orbit ring around avatar */
.avatar-ring {
  position: absolute;
  inset: -6px;
  border: 1px solid rgba(201,168,76,0.3);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  animation: ringRotate 6s linear infinite;
}

@keyframes ringRotate {
  0%   { transform: rotate(0deg) scale(1); opacity: 0.3; }
  50%  { transform: rotate(180deg) scale(1.1); opacity: 0.7; }
  100% { transform: rotate(360deg) scale(1); opacity: 0.3; }
}

/* Boss name block */
.boss-name-block { flex: 1; }

.boss-name {
  font-family: 'Bebas Neue', cursive;
  font-size: 42px;
  letter-spacing: 5px;
  line-height: 1;
  color: var(--white);
  text-shadow:
    0 0 20px var(--crimson-glow),
    0 0 40px var(--crimson),
    3px 3px 0 var(--crimson-deep);
  animation: nameBreath 3s ease-in-out infinite;
}

@keyframes nameBreath {
  0%, 100% { text-shadow: 0 0 20px var(--crimson-glow), 0 0 40px var(--crimson), 3px 3px 0 var(--crimson-deep); }
  50%       { text-shadow: 0 0 30px var(--crimson-glow), 0 0 60px var(--crimson-bright), 3px 3px 0 var(--crimson-deep); }
}

.boss-subtitle {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--crimson-glow);
  opacity: 0.7;
  margin-top: 3px;
}

/* Boss HP display */
.boss-hp-display {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}

.boss-hp-label {
  font-family: 'Orbitron', monospace;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--ash);
  opacity: 0.7;
}

.boss-hp-value {
  font-family: 'Bebas Neue', cursive;
  font-size: 44px;
  letter-spacing: 2px;
  line-height: 1;
  color: var(--crimson-glow);
  text-shadow: 0 0 16px var(--crimson-glow);
  transition: color 0.5s ease;
}

.boss-hp-max {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  color: var(--ash);
  letter-spacing: 1px;
  opacity: 0.5;
}

/* ============================================================
   HEALTH BAR
   ============================================================ */

.boss-bar-wrap {
  position: relative;
  z-index: 2;
  margin-bottom: 12px;
}

.boss-bar-outer {
  position: relative;
  width: 100%;
  height: 28px;
  background: rgba(0,0,0,0.85);
  border: 1px solid var(--crimson-deep);
  clip-path: polygon(10px 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0% 50%);
  overflow: hidden;
}

.boss-bar-fill {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 100%;
  transition: width 1s cubic-bezier(0.22,1,0.36,1),
              background 1s ease;
  animation: barBreath 2s ease-in-out infinite;
}

@keyframes barBreath {
  0%, 100% { filter: brightness(1.0); }
  50%       { filter: brightness(1.4); }
}

/* Segment lines */
.boss-bar-segs {
  position: absolute;
  inset: 0;
  display: flex;
  pointer-events: none;
}
.boss-bar-seg {
  flex: 1;
  border-right: 1px solid rgba(0,0,0,0.5);
}
.boss-bar-seg:last-child { border-right: none; }

/* Scan over bar */
.bar-scan {
  position: absolute;
  top: 0; bottom: 0;
  width: 60px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
  animation: barSweep 2.5s linear infinite;
}
@keyframes barSweep {
  0%   { left: -60px; }
  100% { left: 100%; }
}

/* Bar info row */
.bar-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 5px;
  padding: 0 10px;
}

.bar-pct {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 2px;
  transition: color 0.5s ease;
}

.bar-phase {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 3px;
  animation: phaseFlicker 2s step-end infinite;
}

@keyframes phaseFlicker {
  0%, 80%, 100% { opacity: 1; }
  82%           { opacity: 0.2; }
  84%           { opacity: 1; }
}

.bar-hits {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--ash);
  opacity: 0.6;
}

/* ============================================================
   DAMAGE NUMBER FLOATERS
   ============================================================ */

.damage-floater {
  position: absolute;
  font-family: 'Bebas Neue', cursive;
  font-size: 36px;
  letter-spacing: 3px;
  pointer-events: none;
  z-index: 100;
  animation: floatUp 1.2s ease-out forwards;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
}

@keyframes floatUp {
  0%   { opacity: 1;   transform: translateY(0)    scale(1.2); }
  20%  { opacity: 1;   transform: translateY(-20px) scale(1); }
  100% { opacity: 0;   transform: translateY(-80px) scale(0.8); }
}

/* ============================================================
   TOP ATTACKERS
   ============================================================ */

.boss-attackers {
  display: flex;
  gap: 8px;
  position: relative;
  z-index: 2;
}

.attacker-slot {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  background: rgba(20,0,0,0.7);
  border: 1px solid rgba(139,0,0,0.35);
  clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
  transition: border-color 0.3s ease, background 0.3s ease;
}

.attacker-slot.first {
  border-color: rgba(201,168,76,0.5);
  background: rgba(30,10,0,0.8);
}

.attacker-rank {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  font-weight: 900;
  color: var(--gold-bright);
  flex-shrink: 0;
  width: 16px;
}

.attacker-name {
  font-family: 'Rajdhani', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--white);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.attacker-dmg {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  font-weight: 700;
  color: var(--crimson-glow);
  flex-shrink: 0;
}

/* ============================================================
   DEATH OVERLAY
   ============================================================ */

.death-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  z-index: 200;
  clip-path: polygon(
    20px 0%, calc(100% - 20px) 0%,
    100% 20px, 100% calc(100% - 20px),
    calc(100% - 20px) 100%, 20px 100%,
    0% calc(100% - 20px), 0% 20px
  );
  opacity: 0;
  pointer-events: none;
}

.death-overlay.visible {
  animation: deathReveal 0.5s ease 0.3s forwards;
  pointer-events: all;
  background: rgba(0,0,0,0.85);
}

@keyframes deathReveal {
  0%   { opacity: 0; }
  100% { opacity: 1; }
}

.death-skull {
  font-size: 72px;
  animation: deathSkull 1s ease-in-out infinite;
  filter: drop-shadow(0 0 20px var(--gold));
}

@keyframes deathSkull {
  0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 20px var(--gold)); }
  50%       { transform: scale(1.1); filter: drop-shadow(0 0 40px var(--gold-bright)); }
}

.death-text {
  font-family: 'Bebas Neue', cursive;
  font-size: 72px;
  letter-spacing: 10px;
  color: var(--gold-bright);
  text-shadow: 0 0 30px var(--gold), 0 0 60px var(--gold-bright), 4px 4px 0 rgba(0,0,0,0.8);
  animation: deathPulse 1.5s ease-in-out infinite;
}

@keyframes deathPulse {
  0%, 100% { opacity: 1; text-shadow: 0 0 30px var(--gold), 0 0 60px var(--gold-bright); }
  50%       { opacity: 0.7; text-shadow: 0 0 50px var(--gold-bright), 0 0 100px var(--gold); }
}

.death-subtext {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 5px;
  color: var(--crimson-glow);
  opacity: 0.8;
}

.death-respawn {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--ash);
  margin-top: 8px;
}

/* Death particles */
.death-particle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  pointer-events: none;
  animation: deathParticle 2s ease-out forwards;
}

@keyframes deathParticle {
  0%   { opacity: 1; transform: translate(0, 0) scale(1); }
  100% { opacity: 0; transform: var(--end-pos) scale(0); }
}

/* ============================================================
   PHASE INDICATOR
   ============================================================ */

/* Phase 1 — healthy: crimson */
.phase-1 .boss-card          { border-color: var(--crimson-bright); }
.phase-1 .boss-bar-fill      { background: linear-gradient(90deg, #4A0000, #8B0000, #CC0000, #FF1111); }
.phase-1 .bar-pct            { color: var(--crimson-glow); }
.phase-1 .bar-phase          { color: var(--crimson-glow); }
.phase-1 .boss-hp-value      { color: var(--crimson-glow); text-shadow: 0 0 16px var(--crimson-glow); }

/* Phase 2 — damaged: gold */
.phase-2 .boss-card          { border-color: var(--gold-bright); }
.phase-2 .boss-card::after   { background: linear-gradient(90deg, transparent, var(--gold-bright), var(--crimson-glow), var(--gold-bright), transparent); }
.phase-2 .boss-bar-fill      { background: linear-gradient(90deg, #3a2800, #8B6000, #CC9000, #FFB700); }
.phase-2 .bar-pct            { color: var(--gold-bright); }
.phase-2 .bar-phase          { color: var(--gold-bright); }
.phase-2 .boss-hp-value      { color: var(--gold-bright); text-shadow: 0 0 16px var(--gold); }
.phase-2 .boss-name          { text-shadow: 0 0 20px var(--gold), 0 0 40px var(--gold-bright), 3px 3px 0 #2a1a00; }
.phase-2 .boss-title-text    { color: var(--gold-bright); }
.phase-2 .boss-card::before  { background: linear-gradient(135deg, var(--gold), #3a2800, var(--gold)); }
.phase-2 .boss-corner        { border-color: var(--crimson-glow); }

/* Phase 3 — critical: blue glitch */
.phase-3 .boss-card          { border-color: var(--blue-bright); animation: glitchBorder 0.3s step-end infinite; }
.phase-3 .boss-card::after   { background: linear-gradient(90deg, transparent, var(--blue-bright), var(--crimson-glow), var(--blue-bright), transparent); }
.phase-3 .boss-bar-fill      { background: linear-gradient(90deg, #001040, #002080, #0040CC, #4488FF); }
.phase-3 .bar-pct            { color: var(--blue-bright); animation: critFlicker 0.2s step-end infinite; }
.phase-3 .bar-phase          { color: var(--blue-bright); animation: critFlicker 0.15s step-end infinite; }
.phase-3 .boss-hp-value      { color: var(--blue-bright); text-shadow: 0 0 16px var(--blue); animation: critFlicker 0.25s step-end infinite; }
.phase-3 .boss-name          { animation: nameGlitch 0.4s step-end infinite; }
.phase-3 .boss-card::before  { background: linear-gradient(135deg, var(--blue), #001040, var(--blue)); animation: cardBreath 0.5s ease-in-out infinite; }
.phase-3 .boss-corner        { border-color: var(--blue-bright); animation: cornerFlicker 0.3s step-end infinite; }
.phase-3 .boss-avatar-hex    { animation: avatarGlitch 0.4s step-end infinite; }

@keyframes glitchBorder {
  0%, 100% { border-color: var(--blue-bright); }
  33%       { border-color: var(--crimson-glow); }
  66%       { border-color: var(--gold-bright); }
}

@keyframes critFlicker {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.3; }
}

@keyframes nameGlitch {
  0%, 100% { transform: translateX(0); filter: none; }
  25%       { transform: translateX(-3px); filter: hue-rotate(90deg); }
  75%       { transform: translateX(2px);  filter: hue-rotate(-90deg); }
}

@keyframes avatarGlitch {
  0%, 100% { filter: drop-shadow(0 0 6px var(--blue)); transform: scale(1); }
  33%       { filter: drop-shadow(0 0 20px var(--crimson-glow)) hue-rotate(180deg); transform: scale(1.08) skewX(-2deg); }
  66%       { filter: drop-shadow(0 0 14px var(--gold)); transform: scale(0.95) skewX(1deg); }
}

@keyframes cornerFlicker {
  0%, 100% { border-color: var(--blue-bright); opacity: 0.8; }
  50%       { border-color: var(--crimson-glow); opacity: 0.3; }
}

/* ============================================================
   HIT SHAKE
   ============================================================ */

.boss-wrapper.shake {
  animation: bossShake 0.3s ease forwards !important;
}

@keyframes bossShake {
  0%   { transform: translate(calc(-50% + 0px),   -50%) scale(1); }
  15%  { transform: translate(calc(-50% - 8px),   -50%) scale(1.01); }
  30%  { transform: translate(calc(-50% + 8px),   -50%) scale(1.01); }
  45%  { transform: translate(calc(-50% - 5px),   -50%) scale(1); }
  60%  { transform: translate(calc(-50% + 5px),   -50%) scale(1); }
  75%  { transform: translate(calc(-50% - 2px),   -50%) scale(1); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

</style>
</head>
<body>

<!-- Screen effects -->
<div class="screen-flash crimson" id="screen-flash"></div>
<div class="screen-vignette"      id="screen-vignette"></div>

<!-- Shockwave -->
<div style="position:fixed;top:50%;left:50%;z-index:998;pointer-events:none;">
  <div class="shockwave" id="shockwave"></div>
</div>

<!-- Boss wrapper -->
<div class="boss-wrapper phase-1" id="boss-wrapper">

  <div class="boss-title-plate">
    <span class="boss-title-text" id="boss-title-text">&#x2620; STREAM BOSS ACTIVE &#x2620;</span>
  </div>

  <div class="boss-card" id="boss-card">

    <!-- Drips -->
    <div class="boss-drips">
      <div class="boss-drip"></div><div class="boss-drip"></div>
      <div class="boss-drip"></div><div class="boss-drip"></div>
      <div class="boss-drip"></div><div class="boss-drip"></div>
      <div class="boss-drip"></div>
    </div>

    <div class="boss-scanline"></div>

    <!-- Corners -->
    <div class="boss-corner tl"></div>
    <div class="boss-corner tr"></div>
    <div class="boss-corner bl"></div>
    <div class="boss-corner br"></div>

    <!-- Info row -->
    <div class="boss-info-row">
      <div class="boss-avatar">
        <div class="boss-avatar-hex" id="boss-avatar">&#x2620;</div>
        <div class="avatar-ring"></div>
      </div>
      <div class="boss-name-block">
        <div class="boss-name"     id="boss-name">THE CRIMSON REAPER</div>
        <div class="boss-subtitle" id="boss-subtitle">CORRUPTED LEGION COMMANDER</div>
      </div>
      <div class="boss-hp-display">
        <div class="boss-hp-label">HEALTH REMAINING</div>
        <div class="boss-hp-value" id="boss-hp-val">10,000</div>
        <div class="boss-hp-max"   id="boss-hp-max">/ 10,000 HP</div>
      </div>
    </div>

    <!-- Health bar -->
    <div class="boss-bar-wrap">
      <div class="boss-bar-outer">
        <div class="boss-bar-fill" id="boss-bar-fill"></div>
        <div class="boss-bar-segs" id="boss-bar-segs"></div>
        <div class="bar-scan"></div>
      </div>
      <div class="bar-info">
        <span class="bar-pct"   id="bar-pct">100%</span>
        <span class="bar-phase" id="bar-phase">PHASE I — FULL STRENGTH</span>
        <span class="bar-hits"  id="bar-hits">0 HITS</span>
      </div>
    </div>

    <!-- Top attackers -->
    <div class="boss-attackers" id="boss-attackers">
      <div class="attacker-slot first">
        <span class="attacker-rank">#1</span>
        <span class="attacker-name">---</span>
        <span class="attacker-dmg">0 DMG</span>
      </div>
      <div class="attacker-slot">
        <span class="attacker-rank">#2</span>
        <span class="attacker-name">---</span>
        <span class="attacker-dmg">0 DMG</span>
      </div>
      <div class="attacker-slot">
        <span class="attacker-rank">#3</span>
        <span class="attacker-name">---</span>
        <span class="attacker-dmg">0 DMG</span>
      </div>
    </div>

    <!-- Death overlay -->
    <div class="death-overlay" id="death-overlay">
      <div class="death-skull">&#x2620;</div>
      <div class="death-text">BOSS DEFEATED</div>
      <div class="death-subtext">THE LEGION HAS FALLEN</div>
      <div class="death-respawn" id="death-respawn">RESPAWNING IN 30s</div>
    </div>

  </div>
</div>

<script>

// ============================================================
//   BOSS CONFIG
// ============================================================

var CONFIG = {
  maxHP:       10000,
  respawnTime: 30,   // seconds before boss respawns
  bosses: [
    { name: 'THE CRIMSON REAPER',    subtitle: 'CORRUPTED LEGION COMMANDER',  avatar: '&#x2620;' },
    { name: 'SHADOW OVERLORD',       subtitle: 'PHANTOM OF THE CRIMSON ARENA', avatar: '&#x2620;' },
    { name: 'IRON REAPER MK-II',     subtitle: 'MECHANICAL TERROR UNIT',       avatar: '&#x2620;' },
    { name: 'BLOOD WARDEN',          subtitle: 'GUARDIAN OF THE CRIMSON GATE', avatar: '&#x2620;' },
  ]
};

var DAMAGE = {
  follow:   100,
  sub1:     500,
  sub2:     1000,
  sub3:     2000,
  prime:    500,
  resub:    300,
  bits:     1,
  donation: 100,
  raid:     50
};

// ============================================================
//   STATE
// ============================================================

var STATE = {
  currentHP:    CONFIG.maxHP,
  totalHits:    0,
  alive:        true,
  phase:        1,
  attackers:    {},
  bossIndex:    0,
  respawnTimer: null
};

// ============================================================
//   INIT
// ============================================================

function init() {
  buildSegments();
  updateUI();
  setTimeout(revealBoss, 800);
}

function buildSegments() {
  var segs = document.getElementById('boss-bar-segs');
  segs.innerHTML = '';
  for (var i = 0; i < 10; i++) {
    var s = document.createElement('div');
    s.className = 'boss-bar-seg';
    segs.appendChild(s);
  }
}

// ============================================================
//   REVEAL ANIMATION
// ============================================================

function revealBoss() {
  var wrapper = document.getElementById('boss-wrapper');
  flashScreen('crimson', 150);
  fireShockwave();
  wrapper.classList.add('reveal');
  setTimeout(function() {
    wrapper.classList.remove('reveal');
    wrapper.classList.add('active');
  }, 700);
}

// ============================================================
//   DAMAGE ENGINE
// ============================================================

function dealDamage(username, amount) {
  if (!STATE.alive) return;

  STATE.currentHP = Math.max(0, STATE.currentHP - amount);
  STATE.totalHits++;
  STATE.attackers[username] = (STATE.attackers[username] || 0) + amount;

  // Visual hit effects
  hitEffects(amount);
  updateUI();
  checkPhase();

  if (STATE.currentHP <= 0) {
    triggerDeath();
  }
}

function hitEffects(amount) {
  // Screen vignette
  var vig = document.getElementById('screen-vignette');
  vig.classList.remove('pulse');
  void vig.offsetWidth;
  vig.classList.add('pulse');

  // Card shake
  var wrapper = document.getElementById('boss-wrapper');
  wrapper.classList.remove('shake');
  void wrapper.offsetWidth;
  wrapper.classList.add('shake');
  setTimeout(function() { wrapper.classList.remove('shake'); }, 300);

  // Damage floater
  spawnFloater(amount);
}

function spawnFloater(amount) {
  var card = document.getElementById('boss-card');
  var floater = document.createElement('div');
  floater.className = 'damage-floater';
  floater.textContent = '-' + amount.toLocaleString();

  // Random position across card width
  var x = 100 + Math.random() * 600;
  var y = 20 + Math.random() * 80;
  floater.style.left = x + 'px';
  floater.style.top  = y + 'px';

  // Color by damage size
  if (amount >= 2000)     floater.style.color = '#FFD700';
  else if (amount >= 500) floater.style.color = '#FF8844';
  else                    floater.style.color = '#FF4444';

  if (amount >= 1000) floater.style.fontSize = '48px';

  card.appendChild(floater);
  setTimeout(function() { floater.remove(); }, 1200);
}

// ============================================================
//   PHASE SYSTEM
// ============================================================

function checkPhase() {
  var pct = STATE.currentHP / CONFIG.maxHP;
  var newPhase = 1;
  if (pct <= 0.6 && pct > 0.3) newPhase = 2;
  if (pct <= 0.3)               newPhase = 3;

  if (newPhase !== STATE.phase) {
    STATE.phase = newPhase;
    var wrapper = document.getElementById('boss-wrapper');
    wrapper.className = wrapper.className.replace(/phase-\d/, 'phase-' + newPhase);
    flashScreen(newPhase === 2 ? 'gold' : 'crimson', 200);
    fireShockwave();
  }
}

// ============================================================
//   DEATH SEQUENCE
// ============================================================

function triggerDeath() {
  STATE.alive = false;

  // Full screen death flash
  var flash = document.getElementById('screen-flash');
  flash.className = 'screen-flash death flash-in';
  setTimeout(function() {
    flash.className = 'screen-flash death flash-out';
  }, 400);

  // Explode boss card
  var wrapper = document.getElementById('boss-wrapper');
  setTimeout(function() {
    wrapper.classList.add('death-explode');
    fireShockwave();
    spawnDeathParticles();
  }, 200);

  // Show death overlay
  setTimeout(function() {
    wrapper.classList.remove('death-explode');
    wrapper.classList.add('active');
    document.getElementById('death-overlay').classList.add('visible');
    startRespawnCountdown();
  }, 800);
}

function spawnDeathParticles() {
  var card = document.getElementById('boss-card');
  var colors = ['#FF1111', '#FFD700', '#CC0000', '#FF8844', '#FFFF44'];
  for (var i = 0; i < 20; i++) {
    (function() {
      var p = document.createElement('div');
      p.className = 'death-particle';
      var x = Math.random() * 900;
      var y = Math.random() * 200;
      var ex = (Math.random() - 0.5) * 400;
      var ey = (Math.random() - 1.5) * 300;
      p.style.left     = x + 'px';
      p.style.top      = y + 'px';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.setProperty('--end-pos', 'translate(' + ex + 'px, ' + ey + 'px)');
      p.style.animationDelay = (Math.random() * 0.3) + 's';
      card.appendChild(p);
      setTimeout(function() { p.remove(); }, 2500);
    })();
  }
}

function startRespawnCountdown() {
  var seconds = CONFIG.respawnTime;
  var el = document.getElementById('death-respawn');

  STATE.respawnTimer = setInterval(function() {
    seconds--;
    el.textContent = 'RESPAWNING IN ' + seconds + 's';
    if (seconds <= 0) {
      clearInterval(STATE.respawnTimer);
      respawnBoss();
    }
  }, 1000);
}

function respawnBoss() {
  STATE.bossIndex  = (STATE.bossIndex + 1) % CONFIG.bosses.length;
  var boss         = CONFIG.bosses[STATE.bossIndex];

  STATE.currentHP  = CONFIG.maxHP;
  STATE.totalHits  = 0;
  STATE.attackers  = {};
  STATE.alive      = true;
  STATE.phase      = 1;

  // Update boss identity
  document.getElementById('boss-name').textContent    = boss.name;
  document.getElementById('boss-subtitle').textContent = boss.subtitle;
  document.getElementById('boss-avatar').innerHTML    = boss.avatar;

  // Reset phase class
  var wrapper = document.getElementById('boss-wrapper');
  wrapper.className = wrapper.className.replace(/phase-\d/, 'phase-1');

  // Hide death overlay
  document.getElementById('death-overlay').classList.remove('visible');

  updateUI();
  revealBoss();
}

// ============================================================
//   SCREEN EFFECTS
// ============================================================

function flashScreen(type, duration) {
  var flash = document.getElementById('screen-flash');
  flash.className = 'screen-flash ' + type + ' flash-in';
  setTimeout(function() {
    flash.className = 'screen-flash ' + type + ' flash-out';
  }, duration);
}

function fireShockwave() {
  var sw = document.getElementById('shockwave');
  sw.classList.remove('fire');
  void sw.offsetWidth;
  sw.classList.add('fire');
  setTimeout(function() { sw.classList.remove('fire'); }, 800);
}

// ============================================================
//   UI UPDATE
// ============================================================

function updateUI() {
  var pct = Math.max(0, Math.round((STATE.currentHP / CONFIG.maxHP) * 100));

  document.getElementById('boss-bar-fill').style.width = pct + '%';
  document.getElementById('bar-pct').textContent       = pct + '%';
  document.getElementById('bar-hits').textContent      = STATE.totalHits + ' HITS';
  document.getElementById('boss-hp-val').textContent   = STATE.currentHP.toLocaleString();

  // Phase label
  var phaseLabels = {
    1: 'PHASE I \u2014 FULL STRENGTH',
    2: 'PHASE II \u2014 ENRAGED',
    3: 'PHASE III \u2014 CRITICAL'
  };
  document.getElementById('bar-phase').textContent = phaseLabels[STATE.phase] || '';

  updateAttackers();
}

function updateAttackers() {
  var sorted = Object.keys(STATE.attackers).sort(function(a, b) {
    return STATE.attackers[b] - STATE.attackers[a];
  }).slice(0, 3);

  var slots = document.getElementById('boss-attackers').querySelectorAll('.attacker-slot');
  slots.forEach(function(slot, i) {
    var nameEl = slot.querySelector('.attacker-name');
    var dmgEl  = slot.querySelector('.attacker-dmg');
    if (sorted[i]) {
      nameEl.textContent = sorted[i];
      dmgEl.textContent  = STATE.attackers[sorted[i]].toLocaleString() + ' DMG';
      slot.classList.toggle('first', i === 0);
    } else {
      nameEl.textContent = '---';
      dmgEl.textContent  = '0 DMG';
      slot.classList.remove('first');
    }
  });
}

// ============================================================
//   STREAMLABS EVENT HOOK
// ============================================================

window.addEventListener('onEventReceived', function(obj) {
  var event    = obj.detail;
  var listener = event.listener;
  var d        = event.event;

  if (listener === 'follower-latest') {
    dealDamage(d.name, DAMAGE.follow);
  }
  else if (listener === 'subscriber-latest') {
    var dmg = DAMAGE.sub1;
    if (d.subPlan === '2000')  dmg = DAMAGE.sub2;
    if (d.subPlan === '3000')  dmg = DAMAGE.sub3;
    if (d.subPlan === 'Prime') dmg = DAMAGE.prime;
    if (d.months > 1)          dmg = DAMAGE.resub;
    dealDamage(d.name, dmg);
  }
  else if (listener === 'cheer-latest') {
    dealDamage(d.name, d.amount * DAMAGE.bits);
  }
  else if (listener === 'raid-latest') {
    dealDamage(d.name, d.raiders * DAMAGE.raid);
  }
  else if (listener === 'tip-latest') {
    dealDamage(d.name, Math.floor(parseFloat(d.amount)) * DAMAGE.donation);
  }
});

// ============================================================
//   DEMO HITS
// ============================================================

var demohits = [
  { name: 'ShadowMarksman',  dmg: 100 },
  { name: 'IronPhantom99',   dmg: 500 },
  { name: 'WiseMindKrak',    dmg: 500 },
  { name: 'TacOperator7',    dmg: 1000 },
  { name: 'ShadowMarksman',  dmg: 100 },
  { name: 'SpecOps_Delta',   dmg: 1000 },
  { name: 'CrimsonVanguard', dmg: 2000 },
  { name: 'NightReaper_X',   dmg: 500 },
  { name: 'IronPhantom99',   dmg: 500 },
  { name: 'GhostRecon_X',    dmg: 100 },
];

var dhi = 0;
function runDemoHits() {
  if (dhi < demohits.length) {
    dealDamage(demohits[dhi].name, demohits[dhi].dmg);
    dhi++;
    setTimeout(runDemoHits, 1500);
  }
}

init();
setTimeout(runDemoHits, 1500);

</script>
</body>
</html>
